[package]
name = "wschat"
version = "0.1.0"
edition = "2024"

[dependencies]
# crypto (same primitives as the server / reference client)
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
blake3 = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
serde_json = "1"

# runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-std", "io-util", "signal", "fs"] }

# ws client with TLS (wss:// to telefon.lleo.me)
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

anyhow = "1"

# Ordered map for the outbox: preserves insertion order on iteration so
# pending messages are flushed in the order they were sent. (HashMap's
# iteration order is unspecified — caused out-of-order delivery on reconnect.)
indexmap = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
