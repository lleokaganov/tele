[package]
name = "ws_wasm"
version = "0.1.0"
edition = "2024"
description = "WASM crypto for ws.lleo.me protocol v2"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
blake3 = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
