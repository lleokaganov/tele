[package]
name = "notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
# crypto (same primitives as the server / reference client)
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
blake3 = "1"
rand = "0.8"
hex = "0.4"

# runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }

# ws client to the relay (plain ws:// to localhost — no TLS needed)
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"

# registry persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging / misc
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
anyhow = "1"

# Web Push (RFC 8291) — browser push notifications. VPS notifier (x86_64
# glibc) only; the Pi instance serves devices and skips this feature.
web-push = "0.10"
base64 = "0.13" # must match web-push's base64 (Config / URL_SAFE_NO_PAD)

# FCM (Firebase Cloud Messaging HTTP v1) — push for the native Android app.
# OAuth2 via the project's service-account JSON.
gcp_auth = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Size-optimised release for the Pi. panic stays "unwind" (default).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
